<!DOCTYPE html>

<head>

<link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <a class="logo" href="index.html">
            <span class="logo-circle">P</span>
            <span><b>Prizzy's</b><small>Golden Bite</small></span>

        <main class="viewer">

            </main>
        <script>
        const p=new URLSearchParams(location.search);
        const n=p.get('name')||'Prizzy\'s Golden Bite';
        const t=p.get('type')||'';
        const i=p.get('img')||'images/pie4.png';
        document.getElementById('viewName').textContent=n;document.getElementById('viewType').textContent=t;
        document.getElementById('viewImage').src=i;
        document.getElementById('viewWA').href='https://wa.me/2349024352168?text='+encodeURIComponent("Hello Prizzy's Golden Bite, I am interested in "+n+".");
        </script>
        </body>
